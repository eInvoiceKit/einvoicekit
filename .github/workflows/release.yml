name: Release

# Publishes to npm from a GitHub release, through npm trusted publishing:
# the workflow proves its identity to the registry with an OIDC token
# (`id-token: write`), so no npm token is stored anywhere. npm generates
# provenance automatically for a public repository.
#
# The npm side is STAGED, not published: the trusted publisher on npmjs.com
# allows `npm stage publish` only, so the version lands in a holding area
# nobody can install from. A maintainer approves it with 2FA (npmjs.com,
# Staged Packages, Approve; or `npm stage approve <stage-id>`), and only
# then it goes live. A hijacked workflow cannot publish on its own.
# Staging needs npm CLI 11.15.0 or later, hence the npm upgrade first.
#
# The trusted publisher is configured on npmjs.com, package settings:
# owner eInvoiceKit, repository einvoicekit, workflow release.yml, environment npm,
# allowed action `npm stage publish`.
#
# PyPI works the same way through pypa/gh-action-pypi-publish: a "pending
# publisher" on pypi.org (owner eInvoiceKit, repository einvoicekit, workflow
# release.yml, environment pypi) creates the project on the first publish.
# PyPI's own caveat: the name is not reserved until that first publish
# succeeds.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/einvoicekit
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev
      - run: pytest -q
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "release tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: cp ../LICENSE LICENSE && python -m build
      # `skip-existing` is the action's own switch for the same situation as
      # the npm job's check above: a version PyPI already holds is left alone
      # instead of failing the release. PyPI never overwrites a version either.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The tag is the single source of the version: refuse to publish a
      # package.json that disagrees with it.
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "release tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      # A version npm already serves cannot be published again, and that is
      # not a failure worth a red release: the first publish of a NEW package
      # name has to be manual (npm attaches a trusted publisher only to a
      # package that already exists), so the release that carries that same
      # version finds its work already done. Skipping keeps the release green
      # and still refuses silently to do nothing when the version is new.
      #
      # `npm view <pkg>@<version> version` prints the version when it exists
      # and exits non-zero (E404) when it does not, so the exit code alone is
      # the answer. It reads the public registry, which lags a publish by a
      # few minutes; a false "new" here just reproduces today's error instead
      # of hiding it, which is the safe direction.
      - name: Stage the version on npm unless it is already published
        run: |
          set -uo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to stage." >&2
            echo "Published by hand, most likely: a new package name has to be." >&2
            exit 0
          fi
          npm stage publish --access public
